<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StorePilot AI</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><div><b>StorePilot AI</b><span>مولّد صفحات منتجات بالذكاء الاصطناعي</span></div><button id="settingsBtn">⚙ الإعدادات</button></header>
<main>
<section class="hero"><h1>حطي رابط المنتج فقط.</h1><p>نسحب البيانات والصور، نولّد صفحة بيع كاملة، وبعدين تنشرينها على Shopify.</p><div class="urlbox"><input id="url" placeholder="https://www.aliexpress.com/item/..." dir="ltr"><button id="generate">✨ Generate</button></div><div id="status"></div></section>
<section id="workspace" class="hidden"><div class="grid"><aside class="panel"><h3>المنتج</h3><label>الاسم<input id="title"></label><label>السعر<input id="price"></label><label>العملة<input id="currency"></label><label>الصور</label><div id="images" class="thumbs"></div><button id="regen" class="secondary">إعادة توليد النص</button><button id="publish">نشر إلى Shopify</button></aside><section class="panel preview"><div class="tabs"><button class="tab active">Preview</button></div><div id="preview"></div></section></div></section>
</main>
<dialog id="settings"><form method="dialog"><h2>الإعدادات</h2><h3>AI</h3><label>المزوّد<select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI-compatible</option></select></label><label>API Key<input id="api_key" type="password" dir="ltr"></label><label>Model<input id="model" placeholder="gemini-2.5-flash" dir="ltr"></label><label>Base URL<input id="base_url" placeholder="https://api.openai.com/v1" dir="ltr"></label><label>لغة الصفحة<select id="language"><option value="ar">العربية</option><option value="en">English</option></select></label><hr><h3>Shopify</h3><label>Store domain<input id="shop" placeholder="your-store.myshopify.com" dir="ltr"></label><label>Admin API access token<input id="token" type="password" dir="ltr"></label><label>Publication ID<input id="publication_id" placeholder="gid://shopify/Publication/..." dir="ltr"></label><label class="check"><input id="activate" type="checkbox"> اجعل المنتج Active وانشره للقناة المحددة</label><div class="actions"><button id="testShop" type="button" class="secondary">اختبار Shopify</button><button id="saveSettings" value="default">حفظ</button></div><div id="settingsMsg"></div></form></dialog>
<script src="/static/app.js"></script></body></html>
